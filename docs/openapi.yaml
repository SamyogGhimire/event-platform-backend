openapi: 3.0.3
info:
  title: Events Platform API
  version: 1.0.0
  description: Production-ready Events Platform backend (DRF + SimpleJWT).
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Verified email + password → access and refresh JWTs.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/auth/resend-otp/:
    post:
      operationId: auth_resend_otp_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTP'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/signup/:
    post:
      operationId: auth_signup_create
      description: Register with email, password, and role. Do not send username.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Signup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Signup'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/enrollments/me/:
    get:
      operationId: enrollments_me_list
      description: |-
        List seeker enrollments.
        ?scope=upcoming|past|all (default: all)
        ?status=ENROLLED|CANCELLED (optional)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - enrollments
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentListList'
          description: ''
  /api/events/:
    get:
      operationId: events_list
      description: |-
        Seeker (and authenticated users): search/filter events.
        Query params: q, location, language, starts_after, starts_before.
        Default order: starts_at ASC (upcoming first).
      parameters:
      - in: query
        name: language
        schema:
          type: string
      - in: query
        name: location
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search title/description
      - in: query
        name: starts_after
        schema:
          type: string
        description: ISO-8601 datetime (naive values treated as project TZ/UTC)
      - in: query
        name: starts_before
        schema:
          type: string
        description: ISO-8601 datetime
      tags:
      - events
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/events/{event_id}/cancel/:
    post:
      operationId: events_cancel_create
      description: Cancel the seeker's active enrollment (row kept as CANCELLED audit).
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
          description: ''
  /api/events/{event_id}/enroll/:
    post:
      operationId: events_enroll_create
      description: Enroll the authenticated seeker into an event (concurrency-safe).
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
          description: ''
  /api/events/{id}/:
    get:
      operationId: events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - events
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/facilitator/events/:
    get:
      operationId: facilitator_events_list
      description: 'Facilitator: list own events (with seat counts) + create.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - facilitator
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: facilitator_events_create
      description: 'Facilitator: list own events (with seat counts) + create.'
      tags:
      - facilitator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventWrite'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWrite'
          description: ''
  /api/facilitator/events/{id}/:
    get:
      operationId: facilitator_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - facilitator
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    put:
      operationId: facilitator_events_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - facilitator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventWrite'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWrite'
          description: ''
    patch:
      operationId: facilitator_events_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - facilitator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventWrite'
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWrite'
          description: ''
    delete:
      operationId: facilitator_events_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - facilitator
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          allOf:
          - $ref: '#/components/schemas/Event'
          readOnly: true
        event_id:
          type: integer
          writeOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - id
      - status
      - updated_at
    EnrollmentList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
        event_title:
          type: string
          readOnly: true
        event_starts_at:
          type: string
          format: date-time
          readOnly: true
        event_ends_at:
          type: string
          format: date-time
          readOnly: true
        event_location:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_upcoming:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - event_ends_at
      - event_location
      - event_starts_at
      - event_title
      - id
      - is_upcoming
      - updated_at
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        language:
          type: string
          maxLength: 64
        location:
          type: string
          maxLength: 255
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Null means unlimited capacity.
        created_by:
          type: integer
          readOnly: true
        created_by_email:
          type: string
          format: email
          readOnly: true
        enrollment_count:
          type: integer
          readOnly: true
        available_seats:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - available_seats
      - created_at
      - created_by
      - created_by_email
      - description
      - ends_at
      - enrollment_count
      - id
      - language
      - location
      - starts_at
      - title
      - updated_at
    EventWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        language:
          type: string
          maxLength: 64
        location:
          type: string
          maxLength: 255
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Null means unlimited capacity.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - ends_at
      - id
      - language
      - location
      - starts_at
      - title
      - updated_at
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PaginatedEnrollmentListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentList'
    PaginatedEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    PatchedEventWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        language:
          type: string
          maxLength: 64
        location:
          type: string
          maxLength: 255
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Null means unlimited capacity.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Profile:
      type: object
      properties:
        email:
          type: string
          format: email
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - role
    ResendOTP:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    RoleEnum:
      enum:
      - Seeker
      - Facilitator
      type: string
      description: |-
        * `Seeker` - Seeker
        * `Facilitator` - Facilitator
    Signup:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - password
      - role
    StatusEnum:
      enum:
      - ENROLLED
      - CANCELLED
      type: string
      description: |-
        * `ENROLLED` - Enrolled
        * `CANCELLED` - Cancelled
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    VerifyOTP:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - email
      - otp
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
